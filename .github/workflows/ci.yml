name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            dist-command: dist:linux
            artifact-name: gameplay-simulator-linux
            artifact-path: |
              release/*.AppImage
              release/linux-unpacked/**
          - name: Windows
            os: windows-latest
            dist-command: dist:windows
            artifact-name: gameplay-simulator-windows
            artifact-path: |
              release/*.exe
              release/win-unpacked/**

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Use Node.js from .node-version
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium for release E2E tests
        if: runner.os == 'Windows'
        run: npx playwright install chromium

      - name: Install Chromium and Linux system dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Run unit, UI, and integration tests
        run: npm test

      - name: Run real-adapter E2E tests
        run: npm run test:e2e

      - name: Build the Electron application
        run: npm run build

      - name: Build native release artifacts
        run: npm run ${{ matrix.dist-command }}

      - name: Test the packaged application on Linux
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:packaged -- release/GameplaySimulator-0.1.0-linux-x86_64.AppImage

      - name: Test the packaged application on Windows
        if: runner.os == 'Windows'
        run: npm run test:packaged

      - name: Upload native release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
