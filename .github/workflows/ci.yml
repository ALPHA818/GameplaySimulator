name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            dist-command: dist:linux
            artifact-name: gameplay-simulator-linux
            artifact-path: |
              release/*.AppImage
              release/*.AppImage.sha256
              release/SHA256SUMS-*-linux.txt
          - name: Windows
            os: windows-latest
            dist-command: dist:windows
            artifact-name: gameplay-simulator-windows
            artifact-path: |
              release/*.exe
              release/*.exe.sha256
              release/SHA256SUMS-*-windows.txt
              release/windows-validation-*.json

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Use Node.js from .node-version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Read release version
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'APP_VERSION=' + require('./package.json').version + '\n')"

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit development and build dependencies
        run: npm audit --audit-level=high

      - name: Install Chromium for release E2E tests
        if: runner.os == 'Windows'
        run: npx playwright install chromium

      - name: Install Chromium and Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install --yes libfuse2
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run unit, UI, and integration tests
        run: npm test

      - name: Run real-adapter E2E tests
        run: npm run test:e2e

      - name: Build the Electron application
        run: npm run build

      - name: Build native release artifacts
        run: npm run ${{ matrix.dist-command }}

      - name: Verify current-version artifacts and checksums
        run: node scripts/verify-release-artifacts.mjs ${{ runner.os == 'Windows' && 'windows' || 'linux' }}

      - name: Test the distributed portable application as a standard Windows user
        if: runner.os == 'Windows'
        run: ./scripts/test-windows-standard-user.ps1 -ArtifactPath "release/GameplaySimulator-$env:APP_VERSION-windows-x64.exe"

      - name: Test the packaged application in background mode on Linux
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:packaged -- "release/GameplaySimulator-${APP_VERSION}-linux-x86_64.AppImage"

      - name: Test the packaged application in visible mode on Linux
        if: runner.os == 'Linux'
        env:
          GAMEPLAY_SIMULATOR_RELEASE_SMOKE_VISIBLE: '1'
        run: xvfb-run --auto-servernum npm run test:packaged -- "release/GameplaySimulator-${APP_VERSION}-linux-x86_64.AppImage"

      - name: Test the distributed portable application in background mode on Windows
        if: runner.os == 'Windows'
        run: npm run test:packaged -- "release/GameplaySimulator-$env:APP_VERSION-windows-x64.exe"

      - name: Test the distributed portable application in visible mode on Windows
        if: runner.os == 'Windows'
        env:
          GAMEPLAY_SIMULATOR_RELEASE_SMOKE_VISIBLE: '1'
        run: npm run test:packaged -- "release/GameplaySimulator-$env:APP_VERSION-windows-x64.exe"

      - name: Upload native release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: GameplaySimulator-${{ env.APP_VERSION }}-${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
